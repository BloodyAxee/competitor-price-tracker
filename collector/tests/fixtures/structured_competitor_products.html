<!doctype html>
<html lang="ru">
  <head><title>Structured competitor fixture</title></head>
  <body>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Product",
            "name": "NORDBERG 4523C",
            "offers": {"@type": "Offer", "price": "199000", "priceCurrency": "RUB"}
          },
          {
            "@type": "Product",
            "name": "Балансировочный станок NORDBERG 4523 с автовводом",
            "offers": {
              "@type": "Offer",
              "availability": "https://schema.org/InStock",
              "price": "189000.00",
              "priceCurrency": "RUR"
            }
          }
        ]
      }
    </script>
  </body>
</html>
